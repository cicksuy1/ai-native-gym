# AI-Native Gym — ops tasks (Bun-based). Install go-task (https://taskfile.dev) to
# use these, or run the underlying `bun` commands directly from gym-app/.
version: "3"

tasks:
  setup:
    desc: Install gym-app dependencies (requires Bun — https://bun.sh)
    dir: gym-app
    preconditions:
      - sh: command -v bun
        msg: "Bun is required — install it from https://bun.sh"
    cmds:
      - bun install

  setup-sandbox:
    desc: "Create the practice sandbox (sandbox/) from the seed — run once before Module 0"
    status:
      - test -d sandbox/.git
    cmds:
      - cp -r sandbox-seed sandbox
      - git -C sandbox init -q
      - git -C sandbox add -A
      - git -C sandbox commit -q -m "baseline"

  test:
    desc: Run the server test suite (bun test)
    dir: gym-app
    cmds:
      - bun test server/

  app:
    desc: "Build the web client and run the gym server on :4600"
    dir: gym-app
    cmds:
      - bun run build:web
      - bun run app

  dev:
    desc: "Run server (:4600) and Vite dev client (:4601) for live development"
    dir: gym-app
    cmds:
      - 'echo "Run ''bun run dev:server'' and ''bun run dev:web'' in two terminals."'

  typecheck:
    desc: Type-check the gym-app
    dir: gym-app
    cmds:
      - bun run typecheck
